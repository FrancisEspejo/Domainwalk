name: weekly check

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      domain:
        description: "domain to audit (defaults to the repo DOMAIN variable)"
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: weekly-check
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      # Configurable en Settings > Secrets and variables > Actions > Variables.
      DOMAIN: ${{ inputs.domain || vars.DOMAIN || 'francisravn.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -e ".[crypto]"

      - name: fetch the baseline
        # Vive en su propia rama, así el bot nunca escribe en main.
        run: |
          if git ls-remote --exit-code --heads origin baseline >/dev/null 2>&1; then
            git fetch origin baseline
            git show origin/baseline:baseline.json > baseline.json
          else
            echo "sin rama baseline, primera ejecución"
          fi

      - name: audit
        # exit 1 significa "hay hallazgos en rojo", no un fallo del job.
        run: domainwalk "$DOMAIN" --json --no-config -o current.json || true

      - name: compare
        id: cmp
        run: python scripts/compare.py baseline.json current.json body.md >> "$GITHUB_OUTPUT"

      - name: open issue
        if: steps.cmp.outputs.changed == 'true'
        run: gh issue create --title "Surface changes on $DOMAIN" --body-file body.md
        env:
          GH_TOKEN: ${{ github.token }}

      # La línea base se mueve solo cuando hay algo que contar. Sin esto, un
      # cambio legítimo reabriría el mismo issue cada semana.
      - name: update the baseline
        if: steps.cmp.outputs.changed == 'true' || steps.cmp.outputs.first_run == 'true'
        run: |
          cp current.json /tmp/baseline.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan tmp-baseline
          git rm -rf --cached . >/dev/null 2>&1 || true
          cp /tmp/baseline.json baseline.json
          git add -f baseline.json
          git commit -m "weekly check: new baseline for $DOMAIN"
          git push -f origin tmp-baseline:baseline
